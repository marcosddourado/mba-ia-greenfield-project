services:
  nestjs-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Object storage (S3-compatible). API port 9000 is NOT published to the host —
  # the browser reaches it only through the masking gateway (per TD-04/TD-08).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-streamtube}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-streamtube-secret}
    ports:
      - "9001:9001" # web console (host debugging only)
    volumes:
      - minio-data:/data

  # One-shot: create the video bucket once MinIO is up.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    environment:
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-streamtube}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-streamtube-secret}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-streamtube-videos}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$STORAGE_ACCESS_KEY\" \"$$STORAGE_SECRET_KEY\"; do echo 'waiting for minio'; sleep 2; done;
      mc mb --ignore-existing local/\"$$STORAGE_BUCKET\";
      "

  # Public masking gateway: the ONLY host-facing door to object storage.
  # Presigned URLs are signed against this host; `Host` is passed through so the
  # SigV4 signature validates upstream at MinIO.
  storage-gateway:
    image: caddy:2-alpine
    ports:
      - "9000:9000"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      minio:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated video-processing worker (FFmpeg, per TD-03). In dev it builds from
  # the shared Dockerfile.dev (which now carries ffmpeg) and runs the worker
  # entrypoint in watch mode; production uses Dockerfile.worker (node dist/main.worker).
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker:dev
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  minio-data:
